name: Lolo AI verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Verification only. This workflow must never publish the application publicly.
# A failing check blocks confidence in release; it must not be bypassed.
permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck all TypeScript projects
        run: bun run typecheck

      - name: Lint repository
        run: bun run lint

      - name: Run test suite
        run: bun run test

      - name: Build production frontend
        run: bun run build
