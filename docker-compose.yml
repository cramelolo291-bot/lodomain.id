name: lolo-ai

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lolo
      POSTGRES_PASSWORD: lolo
      POSTGRES_DB: lolo
      # The app speaks English internally; keeping the cluster in one locale
      # avoids "lc_collate does not exist" on some minimal images.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lolo -d lolo"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Exposed only on loopback. The server reaches it over the compose network.
    security_opt:
      - no-new-privileges:true

  # Optional. If Ollama already runs on the host, delete this block and set
  # OLLAMA_URL=http://host.docker.internal:11434 in .env instead.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      # Keeps the model resident between turns. Without it Ollama unloads after
      # five idle minutes and every request pays a reload.
      OLLAMA_KEEP_ALIVE: 45m
      OLLAMA_NUM_PARALLEL: "2"
    # Uncomment on a machine with an NVIDIA GPU to use the host driver.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # The product. Serves dist/, the API, and an OpenAI-compatible endpoint from
  # one process, and applies migrations on boot.
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      # Optional: the stack boots without a .env, and falls back to printing
      # magic links to the log instead of sending them.
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "8787"
      STATIC_DIR: dist
      # Service names, not localhost — inside the compose network.
      DATABASE_URL: postgres://lolo:lolo@db:5432/lolo
      OLLAMA_URL: http://ollama:11434
      # One migration step on boot. Convenient for one box; for a real deploy
      # run `docker compose run --rm app bun run db:migrate` as its own step and
      # set this to "false".
      AUTO_MIGRATE: "true"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      # Set this to your reverse proxy's address once one is in front, or the
      # rate limiter will see only the proxy.
      TRUST_PROXY: "${TRUST_PROXY:-}"
    ports:
      # Loopback only. Put a TLS proxy in front of it rather than exposing this
      # directly to the internet.
      - "127.0.0.1:8787:8787"
    volumes:
      - backups:/app/backups
    security_opt:
      - no-new-privileges:true

volumes:
  db-data:
  ollama-models:
  backups:
