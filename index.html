<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#08070c" media="(prefers-color-scheme: dark)" />
  <!--
    Theme selection has to happen before first paint, otherwise the page
    flashes one theme and then swaps. This runs synchronously in <head>, ahead
    of any stylesheet Vite injects. The class used to be hardcoded to "dark",
    which meant the light theme could never render at all.
  -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("lolo.theme");
        var dark = stored ? stored === "dark" : !window.matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>
  <meta
    name="description"
    content="LOLODOMAIN.ID — workspace agent modular untuk messaging, browser automation, security, cloud, analysis, dan deployment dengan akses terkontrol."
  />
  <title>LOLODOMAIN.ID — Agent Workspace</title>
</head>


<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
